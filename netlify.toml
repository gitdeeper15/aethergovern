# ═══════════════════════════════════════════════════════════════════════════
# AetherGovern v2.0.0 — Netlify configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# Site:    https://aethergovern.netlify.app
# Repo:    https://github.com/gitdeeper15/aethergovern
# Paper:   https://doi.org/10.5281/zenodo.24054524
#
# This is a static site. The site content is served from the repository root.
# ═══════════════════════════════════════════════════════════════════════════

[build]
  publish = "."
  command = ""

[build.environment]
  PYTHON_VERSION = "3.11"
  AETHERGOVERN_VERSION = "2.0.0"
  AETHERGOVERN_PAPER_VERSION = "0.1.0"
  AETHERGOVERN_DOI = "10.5281/zenodo.24054524"
  AETHERGOVERN_OSF = "10.17605/OSF.IO/TAHC8"

# ───────────────────────────────────────────────────────────────────────────
# Redirects
# ───────────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/paper"
  to = "https://doi.org/10.5281/zenodo.24054524"
  status = 302
  force = true

[[redirects]]
  from = "/doi"
  to = "https://doi.org/10.5281/zenodo.24054524"
  status = 302
  force = true

[[redirects]]
  from = "/osf"
  to = "https://doi.org/10.17605/OSF.IO/TAHC8"
  status = 302
  force = true

[[redirects]]
  from = "/github"
  to = "https://github.com/gitdeeper15/aethergovern"
  status = 302
  force = true

[[redirects]]
  from = "/pypi"
  to = "https://pypi.org/project/aethergovern/"
  status = 302
  force = true

[[redirects]]
  from = "/orcid"
  to = "https://orcid.org/0009-0003-8903-0029"
  status = 302
  force = true

[[redirects]]
  from = "/aethergit"
  to = "https://doi.org/10.5281/zenodo.23966896"
  status = 302
  force = true

[[redirects]]
  from = "/aetherflow"
  to = "https://doi.org/10.5281/zenodo.23979129"
  status = 302
  force = true

[[redirects]]
  from = "/aetherproof"
  to = "https://doi.org/10.5281/zenodo.24013124"
  status = 302
  force = true

[[redirects]]
  from = "/aethermesh"
  to = "https://doi.org/10.5281/zenodo.24053492"
  status = 302
  force = true

# SPA-style fallback (harmless for a static site)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ───────────────────────────────────────────────────────────────────────────
# Headers
# ───────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

# ───────────────────────────────────────────────────────────────────────────
# Context (deploy previews)
# ───────────────────────────────────────────────────────────────────────────

[context.deploy-preview]
  command = ""

[context.branch-deploy]
  command = ""

[context.production.environment]
  AETHERGOVERN_ENV = "production"

[context.deploy-preview.environment]
  AETHERGOVERN_ENV = "preview"

[context.branch-deploy.environment]
  AETHERGOVERN_ENV = "branch"

# ═══════════════════════════════════════════════════════════════════════════
# End of netlify.toml (v2.0.0)
# ═══════════════════════════════════════════════════════════════════════════
